name: Portfolio
markdown: kramdown
url: https://sebastiendegodez.github.io
lang: fr

# Blog — articles dans _blog/NNN-slug.md, publiés sur /blog/<slug>/
# Le slug vient du front matter (clé `slug`), le préfixe NNN ne sert qu'à ordonner les fichiers.
collections:
  blog:
    output: true
    permalink: /blog/:slug/
  # Présentations Reveal.js — _decks/NNN-slug.md, publiées sur /slides/<slug>/
  # (à ne pas confondre avec presentations/, généré par scripts/sync-presentations.sh)
  decks:
    output: true
    permalink: /slides/:slug/

defaults:
  - scope:
      path: ""
      type: blog
    values:
      layout: post
      author: DEGODEZ Sébastien
  - scope:
      path: ""
      type: decks
    values:
      layout: deck
